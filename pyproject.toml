[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "galileo-mission-analysis-toolkit"
version = "0.1.0"
description = "Simplified GNSS mission-analysis toolkit: Walker Delta notation, constellation availability, and Galileo-altitude manoeuvre budgeting."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Andrew Allan" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["gnss", "galileo", "mission-analysis", "satellite-navigation", "portfolio"]

[project.urls]
Repository = "https://github.com/theonlyallana/galileo-mission-analysis-toolkit"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
galileo-mission-analysis = "galileo_mission_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
