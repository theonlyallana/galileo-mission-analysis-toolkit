[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "galileo-mission-analysis-toolkit"
version = "0.1.0"
description = "Planned GNSS mission-analysis toolkit inspired by Galileo navigation training concepts."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Andrew Allan" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["gnss", "galileo", "mission-analysis", "satellite-navigation", "portfolio"]

[project.urls]
Repository = "https://github.com/theonlyallana/galileo-mission-analysis-toolkit"
